
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yuri Games - TV Kids</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    body {
      margin: 0;
      background: #171717;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 18px;
      background: #252525;
      font-size: 22px;
      font-weight: bold;
    }

    main {
      display: flex;
      gap: 20px;
      padding: 20px;
      flex-wrap: wrap;
    }

    .player {
      flex: 2;
      min-width: 280px;
    }

    video {
      width: 100%;
      background: black;
      aspect-ratio: 16 / 9;
    }

    aside {
      flex: 1;
      min-width: 220px;
      max-height: 500px;
      overflow-y: auto;
      background: #252525;
      border-radius: 8px;
      padding: 12px;
    }

    .channel {
      display: block;
      width: 100%;
      padding: 13px;
      margin-bottom: 7px;
      background: #383838;
      color: white;
      border: 0;
      border-radius: 5px;
      text-align: left;
      cursor: pointer;
    }

    .channel:hover {
      background: #555;
    }

    #status {
      color: #ccc;
      padding: 10px 0;
    }
  </style>
</head>

<body>

<header>Yuri Games - TV Kids</header>

<main>
  <section class="player">
    <video id="video" controls playsinline></video>
    <p id="status">Carregando canais...</p>
  </section>

  <aside>
    <h3>Canais</h3>
    <div id="channels"></div>
  </aside>
</main>

<script>
  const playlistURL =
    "https://iptv-org.github.io/iptv/categories/kids.m3u";

  const video = document.getElementById("video");
  const channelsBox = document.getElementById("channels");
  const status = document.getElementById("status");

  let hls = null;

  async function loadPlaylist() {
    try {
      const response = await fetch(playlistURL);

      if (!response.ok) {
        throw new Error("Não foi possível carregar a playlist.");
      }

      const text = await response.text();
      const lines = text.split(/\r?\n/);

      let name = "";

      for (const line of lines) {
        if (line.startsWith("#EXTINF")) {
          name = line.split(",").pop().trim();
        } else if (line.trim() && !line.startsWith("#") && name) {
          const url = line.trim();

          // Mostra apenas streams autorizados que você adicionar.
          if (url.startsWith("https://SEU-STREAM-AUTORIZADO/")) {
            addChannel(name, url);
          }

          name = "";
        }
      }

      status.textContent =
        "Playlist carregada. Adicione streams autorizados para reprodução.";

      if (!channelsBox.children.length) {
        channelsBox.textContent =
          "Nenhum stream autorizado foi configurado ainda.";
      }

    } catch (error) {
      status.textContent = "Erro ao carregar a playlist: " + error.message;
    }
  }

  function addChannel(name, url) {
    const button = document.createElement("button");
    button.className = "channel";
    button.textContent = name;

    button.onclick = () => playChannel(url, name);

    channelsBox.appendChild(button);
  }

  function playChannel(url, name) {
    if (hls) {
      hls.destroy();
      hls = null;
    }

    status.textContent = "Carregando: " + name;

    if (Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play();
        status.textContent = "Reproduzindo: " + name;
      });

      hls.on(Hls.Events.ERROR, () => {
        status.textContent = "Não foi possível reproduzir este canal.";
      });

    } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
      video.src = url;
      video.play();
    } else {
      status.textContent = "Seu navegador não suporta este formato.";
    }
  }

  loadPlaylist();
</script>

</body>
</html>
