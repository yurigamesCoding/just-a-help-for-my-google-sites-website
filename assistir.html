
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yuri Games TV Kids</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    body {
      margin: 0;
      background: #171717;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      background: #252525;
      padding: 20px;
      font-size: 23px;
      font-weight: bold;
    }

    main {
      display: flex;
      gap: 20px;
      padding: 20px;
      flex-wrap: wrap;
    }

    .player {
      flex: 2;
      min-width: 280px;
    }

    video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: black;
    }

    aside {
      flex: 1;
      min-width: 230px;
      max-height: 500px;
      overflow-y: auto;
      background: #252525;
      padding: 15px;
      border-radius: 8px;
    }

    .channel {
      display: block;
      width: 100%;
      padding: 13px;
      margin-bottom: 8px;
      border: 0;
      border-radius: 5px;
      background: #383838;
      color: white;
      text-align: left;
      cursor: pointer;
    }

    .channel:hover {
      background: #555;
    }

    #status {
      color: #ccc;
    }
  </style>
</head>

<body>

<header>Yuri Games TV Kids</header>

<main>
  <section class="player">
    <video id="video" controls playsinline></video>
    <p id="status">Aguardando playlist...</p>
  </section>

  <aside>
    <h3>Lista de canais</h3>
    <div id="channels"></div>
  </aside>
</main>

<script>
  // Coloque aqui o endereço de uma playlist M3U autorizada.
  const playlistURL = "COLE_A_URL_DA_SUA_PLAYLIST_AUTORIZADA";

  const video = document.getElementById("video");
  const channelsBox = document.getElementById("channels");
  const status = document.getElementById("status");

  let hls = null;

  async function loadPlaylist() {
    try {
      const response = await fetch(playlistURL);

      if (!response.ok) {
        throw new Error("Erro ao buscar playlist.");
      }

      const playlist = await response.text();
      const lines = playlist.split(/\r?\n/);

      let channelName = "";
      let count = 0;

      for (const line of lines) {
        if (line.startsWith("#EXTINF")) {
          channelName = line.split(",").pop().trim();
        } else if (
          line.trim() &&
          !line.startsWith("#") &&
          channelName
        ) {
          const streamURL = line.trim();

          addChannel(channelName, streamURL);
          channelName = "";
          count++;
        }
      }

      status.textContent = count + " canais encontrados.";

      if (count === 0) {
        status.textContent = "Nenhum canal encontrado.";
      }

    } catch (error) {
      status.textContent =
        "Não foi possível carregar a playlist: " + error.message;
    }
  }

  function addChannel(name, url) {
    const button = document.createElement("button");

    button.className = "channel";
    button.textContent = name;

    button.addEventListener("click", () => {
      playChannel(url, name);
    });

    channelsBox.appendChild(button);
  }

  function playChannel(url, name) {
    if (hls) {
      hls.destroy();
      hls = null;
    }

    video.pause();
    video.removeAttribute("src");
    video.load();

    status.textContent = "Carregando " + name + "...";

    if (Hls.isSupported()) {
      hls = new Hls();

      hls.loadSource(url);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play().catch(() => {
          status.textContent =
            "Clique no botão de reprodução para assistir.";
        });
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          status.textContent =
            "Não foi possível reproduzir este canal.";
        }
      });

    } else if (
      video.canPlayType("application/vnd.apple.mpegurl")
    ) {
      video.src = url;
      video.play();
    } else {
      status.textContent =
        "Seu navegador não suporta HLS.";
    }
  }

  loadPlaylist();
</script>

</body>
</html>
